<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c9c7bf; stroke-width: 1.2; rx: 8; }
      .zone { fill: #f6f5f1; stroke: none; rx: 12; }
      .t { fill: #0b0b0b; font-weight: 600; }
      .s { fill: #52514e; font-size: 11.5px; }
      .h { fill: #52514e; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
      .l { stroke: #52514e; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #0b0b0b; }
    </style>
  </defs>
  <rect width="1120" height="540" fill="#fcfcfb"/>

  <!-- zones -->
  <rect class="zone" x="16" y="16" width="200" height="508"/>
  <text class="h" x="32" y="42">1 · EDGE (CHANTIER)</text>
  <rect class="zone" x="236" y="16" width="220" height="508"/>
  <text class="h" x="252" y="42">2 · BUS ASYNCHRONE</text>
  <rect class="zone" x="476" y="16" width="230" height="508"/>
  <text class="h" x="492" y="42">3 · STREAM PROCESSING</text>
  <rect class="zone" x="726" y="16" width="180" height="508"/>
  <text class="h" x="742" y="42">4 · DATA LAKE</text>
  <rect class="zone" x="926" y="16" width="178" height="508"/>
  <text class="h" x="942" y="42">5 · SERVING</text>

  <!-- edge -->
  <rect class="box" x="32" y="62" width="168" height="66"/>
  <text class="t" x="44" y="86">4 caméras fixes</text>
  <text class="s" x="44" y="104">mâts 6 m · 5 Hz</text>
  <text class="s" x="44" y="119">position au sol + bruit</text>
  <rect class="box" x="32" y="144" width="168" height="80"/>
  <text class="t" x="44" y="168">5 body-cams POV</text>
  <text class="s" x="44" y="186">10 Hz · pose 3D ego</text>
  <text class="s" x="44" y="201">odométrie, mains/objets</text>
  <text class="s" x="44" y="216">coupures wifi → buffer SD</text>
  <rect class="box" x="32" y="240" width="168" height="66"/>
  <text class="t" x="44" y="264">Vidéo réelle</text>
  <text class="s" x="44" y="282">MediaPipe · visages</text>
  <text class="s" x="44" y="297">floutés à l'edge</text>
  <rect class="box" x="32" y="322" width="168" height="66" stroke-dasharray="4 3"/>
  <text class="t" x="44" y="346">Vérité terrain</text>
  <text class="s" x="44" y="364">simulation uniquement :</text>
  <text class="s" x="44" y="379">mesure de la précision</text>
  <text class="s" x="32" y="420">Latence variable,</text>
  <text class="s" x="32" y="436">messages désordonnés :</text>
  <text class="s" x="32" y="452">c'est le cas réel</text>
  <text class="s" x="32" y="468">qu'on veut montrer.</text>

  <!-- kafka -->
  <rect class="box" x="252" y="62" width="188" height="440"/>
  <text class="t" x="264" y="86">Apache Kafka (KRaft)</text>
  <text class="s" x="264" y="104">6 partitions / topic</text>
  <text class="mono" x="264" y="136">edge.fixedcam.detections</text>
  <text class="mono" x="264" y="156">edge.pov.frames</text>
  <text class="mono" x="264" y="176">edge.pov.interactions</text>
  <text class="mono" x="264" y="196">sim.groundtruth</text>
  <line x1="264" x2="428" y1="214" y2="214" stroke="#e1dfd8"/>
  <text class="mono" x="264" y="236">twin.state</text>
  <text class="mono" x="264" y="256">twin.events</text>
  <line x1="264" x2="428" y1="274" y2="274" stroke="#e1dfd8"/>
  <text class="mono" x="264" y="296">ops.metrics</text>
  <text class="mono" x="264" y="316">control.sim</text>
  <text class="s" x="264" y="356">Producteurs non bloquants</text>
  <text class="s" x="264" y="372">(micro-batch, gzip)</text>
  <text class="s" x="264" y="396">1 consumer group par</text>
  <text class="s" x="264" y="412">traitement = fan-out</text>
  <text class="s" x="264" y="436">Rétention 7 j : rejouable</text>

  <!-- stream -->
  <rect class="box" x="492" y="62" width="198" height="120"/>
  <text class="t" x="504" y="86">stream-fusion</text>
  <text class="s" x="504" y="104">fenêtres 0,2 s en event time</text>
  <text class="s" x="504" y="120">watermark = max(t) − 2 s</text>
  <text class="s" x="504" y="136">fusion caméras + odométrie</text>
  <text class="s" x="504" y="152">actions · rôles · alertes TMS</text>
  <text class="s" x="504" y="168">late events → batch</text>
  <rect class="box" x="492" y="198" width="198" height="66"/>
  <text class="t" x="504" y="222">stream-progress</text>
  <text class="s" x="504" y="240">pose détectée → slot BIM</text>
  <text class="s" x="504" y="255">avancement, cadence, ETA</text>
  <rect class="box" x="492" y="280" width="198" height="50"/>
  <text class="t" x="504" y="304">lake-bronze</text>
  <text class="s" x="504" y="320">brut, sans transformation</text>
  <rect class="box" x="492" y="346" width="198" height="50"/>
  <text class="t" x="504" y="370">lake-silver</text>
  <text class="s" x="504" y="386">twin.* → tables Parquet</text>

  <!-- lake -->
  <rect class="box" x="742" y="62" width="148" height="66"/>
  <text class="t" x="754" y="86">bronze</text>
  <text class="s" x="754" y="104">JSON brut / topic</text>
  <text class="s" x="754" y="119">date= / hour=</text>
  <rect class="box" x="742" y="144" width="148" height="66"/>
  <text class="t" x="754" y="168">silver</text>
  <text class="s" x="754" y="186">tracks (poses 3D)</text>
  <text class="s" x="754" y="201">events (BIM, alertes)</text>
  <rect class="box" x="742" y="226" width="148" height="66"/>
  <text class="t" x="754" y="250">gold</text>
  <text class="s" x="754" y="268">KPI, heatmap,</text>
  <text class="s" x="754" y="283">courbe d'avancement</text>
  <rect class="box" x="742" y="320" width="148" height="76"/>
  <text class="t" x="754" y="344">Job batch</text>
  <text class="s" x="754" y="362">DuckDB SQL</text>
  <text class="s" x="754" y="377">+ export dataset</text>
  <text class="s" x="754" y="420">Parquet zstd,</text>
  <text class="s" x="754" y="436">écriture atomique</text>

  <!-- serving -->
  <rect class="box" x="942" y="62" width="146" height="100"/>
  <text class="t" x="954" y="86">API FastAPI</text>
  <text class="s" x="954" y="104">WebSocket live</text>
  <text class="s" x="954" y="119">replay (silver)</text>
  <text class="s" x="954" y="134">analytics (DuckDB)</text>
  <text class="s" x="954" y="149">contrôle → Kafka</text>
  <rect class="box" x="942" y="178" width="146" height="66"/>
  <text class="t" x="954" y="202">Viewer 3D</text>
  <text class="s" x="954" y="220">Three.js · live,</text>
  <text class="s" x="954" y="235">replay, POV</text>
  <rect class="box" x="942" y="276" width="146" height="66"/>
  <text class="t" x="954" y="300">Entreprises BTP</text>
  <text class="s" x="954" y="318">suivi, sécurité,</text>
  <text class="s" x="954" y="333">productivité</text>
  <rect class="box" x="942" y="358" width="146" height="66"/>
  <text class="t" x="954" y="382">Roboticiens</text>
  <text class="s" x="954" y="400">dataset LeRobot</text>
  <text class="s" x="954" y="415">(licence)</text>

  <!-- flèches -->
  <path class="l" d="M200 95 H250"/>
  <path class="l" d="M200 184 H250"/>
  <path class="l" d="M200 273 H250"/>
  <path class="l" d="M200 355 H250"/>
  <path class="l" d="M440 122 H490"/>
  <path class="l" d="M440 231 H490"/>
  <path class="l" d="M440 305 H490"/>
  <path class="l" d="M440 371 H490"/>
  <path class="l" d="M492 150 C460 160 460 230 442 236" stroke-dasharray="3 3"/>
  <path class="l" d="M690 305 C716 305 716 95 740 95"/>
  <path class="l" d="M690 371 C720 371 715 177 740 177"/>
  <path class="l" d="M816 210 V224"/>
  <path class="l" d="M816 292 V318"/>
  <path class="l" d="M890 177 C915 177 915 125 940 125"/>
  <path class="l" d="M890 358 C918 358 918 391 940 391"/>
  <path class="l" d="M1015 162 V176"/>
  <path class="l" d="M1015 244 V274"/>
  <path class="l" d="M492 254 C470 258 462 258 442 256" stroke-dasharray="3 3"/>
  <path class="l" d="M440 488 H1108 V112 H1090"/>
  <text class="s" x="720" y="482">twin.* en direct (WebSocket)</text>
</svg>
