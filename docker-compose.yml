# Architecture distribuée : Kafka + 3 micro-services découplés par le bus.
#   docker compose up --build      → http://localhost:8000  (jumeau numérique)
#                                  → http://localhost:8080  (Kafka UI : topics, partitions, consumer lag)
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: construct-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # mode KRaft (sans ZooKeeper)
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: construct-ai
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  # Couche STREAM : fusion event-time, BIM matching, écriture du data lake
  stream:
    build: .
    command: ["stream", "--bus", "kafka"]
    environment: &env
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CONSTRUCT_LAKE: /data/lake
    volumes: ["./data:/data"]
    depends_on:
      kafka: { condition: service_healthy }

  # Couche SERVING : API + WebSocket + viewer 3D
  api:
    build: .
    command: ["api", "--bus", "kafka"]
    environment: *env
    volumes: ["./data:/data"]
    ports: ["8000:8000"]
    depends_on:
      kafka: { condition: service_healthy }

  # Couche EDGE : chantier simulé + caméras (remplaçable par de vraies caméras)
  edge:
    build: .
    command: ["edge", "--bus", "kafka"]
    environment:
      <<: *env
      CONSTRUCT_SPEED: "10"
    depends_on:
      kafka: { condition: service_healthy }
      stream: { condition: service_started }
